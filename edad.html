<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificador de edad</title>
</head>
<body>

    <h1>Verificador de edad</h1>

    <label for="inputEdad">Ingresa tu edad:</label>
    <input type="number" id="inputEdad" placeholder="Ej. 25">
    
    <button onclick="verificarEdad()">Verificar</button>

    <script>
        function verificarEdad() {

            let entrada = document.getElementById("inputEdad").value;
            let edad = Number(entrada);
            if (entrada.trim() === "") {
                alert("Por favor, ingresa tu edad.");
            }
            // Validar que sea un número válido 
            else if (isNaN(edad) || edad < 0) {
                alert("Por favor, ingresa un número válido y mayor o igual a 0.");
            }
            else if (edad >= 18) {
                alert("Eres mayor de edad");
            }
            else {
                alert("Eres menor de edad");
            }
        }
    </script>

</body>
</html>
